<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-visual" />
<title>Stickfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Kaushan+Script&display=swap" onload="this.rel='stylesheet'" />
<style>
  html,body{margin:0;height:100%;background:#05040a;overflow:hidden;font-family:ui-monospace,Consolas,monospace;color:#d8d2e8}
  canvas{display:block}
  /* scrollbars: thin ink track, ink-stroke thumb, red on hover (all scrollable areas) */
  *{scrollbar-width:thin;scrollbar-color:#3a2e2e #0b080c}
  *:hover{scrollbar-color:#e04040 #0b080c}
  ::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-track{background:#0b080c}
  ::-webkit-scrollbar-thumb{background:#3a2e2e;border:2px solid #0b080c;border-radius:6px 2px 6px 2px}
  ::-webkit-scrollbar-thumb:hover{background:#e04040} ::-webkit-scrollbar-corner{background:#0b080c}
  /* views: nav/controls stay put. The panel is the scroll container; its back button + tab nav are a
     sticky opaque header (content scrolls under it), edge shadow appears once scrolled. */
  #fe .codex{padding-top:0!important}
  #fe .codex > .btn[data-a=close]{position:sticky;top:0;z-index:3;margin-top:12px}
  #fe .codex nav{position:sticky;top:0;z-index:2;margin:0!important;padding:12px 0 10px 110px;background:#07060a;box-shadow:0 1px 0 #ffffff10}
  #fe .codex > .btn[data-a=close]{float:left;margin-right:-100px}
  @supports (animation-timeline: scroll()) {
    #fe .codex nav{animation:navEdge linear both;animation-timeline:scroll(nearest);animation-range:0 40px}
    @keyframes navEdge{from{box-shadow:0 1px 0 #ffffff10}to{box-shadow:0 10px 18px -8px #000,0 1px 0 #e0404055}}
  }
  .view .view-head{position:sticky;top:0;z-index:2;background:#07060a} .view .view-foot{position:sticky;bottom:0;z-index:2;background:#07060a}
  /* overlay views: when any panel is open, underlying UI text is hidden (not just covered) and the
     canvases underneath are dimmed, desaturated and softly blurred */
  html[data-panel] #fe .menu, html[data-panel] #fe .cap, html[data-panel] #fe .keys, html[data-panel] #fe h1,
  html[data-panel] #fe .center, html[data-panel] #fe .tip, html[data-panel] #hud{visibility:hidden!important;transition:none!important;animation:none!important}
  html[data-panel] canvas, html[data-panel] #veil{filter:brightness(.32) saturate(.35) blur(2px);transition:filter .25s}
  /* ...but not the panel's own canvases (skill web, realm radars): those are the content and must stay crisp and saturated */
  html[data-panel] #fe .codex canvas, html[data-panel] .view canvas{filter:none;transition:none}
  html[data-panel] #fe .codex, html[data-panel] .view{background:#07060af7;visibility:visible}
  /* pre-JS loader: paints with the HTML, before any module arrives */
  #preload{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(ellipse at 50% 60%,#1a0a10 0,#05040a 70%);transition:opacity .5s}
  #preload.gone{opacity:0;pointer-events:none}
  #preload b{font:700 min(12vw,96px)/1 Impact,'Arial Black',sans-serif;letter-spacing:.14em;color:#e8e2d6;text-shadow:0 0 30px #c0303066;animation:pl 2.4s ease-in-out infinite}
  #preload .bar{width:min(60vw,420px);height:3px;background:#ffffff14;position:relative;overflow:hidden}
  #preload .bar i{position:absolute;left:0;top:0;bottom:0;width:2%;background:linear-gradient(90deg,#e04040,#ffd0c0);transition:width .3s}
  #preload .st{font:11px system-ui;letter-spacing:.3em;text-transform:uppercase;opacity:.5;color:#d8d2c4}
  @keyframes pl{50%{opacity:.7;letter-spacing:.18em}}
  #hud{position:fixed;inset:0;pointer-events:none}
  #mode{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:18px;letter-spacing:.35em;padding:6px 18px;border:1px solid #fff3;background:#000a}
  #mode.plan{color:#7fd7ff;border-color:#7fd7ff88}
  #mode.live{color:#ff5a4f;border-color:#ff5a4f88}
  #target{position:absolute;top:58px;left:50%;transform:translateX(-50%);font-size:13px;color:#ffd27f;text-shadow:0 0 6px #000}
  #info{position:absolute;left:14px;bottom:74px;font-size:12px;line-height:1.6;background:#000a;padding:10px 12px;border-left:2px solid #ff5a4f}
  #queue{position:absolute;right:14px;bottom:14px;font-size:12px;line-height:1.6;background:#000a;padding:10px 12px;min-width:190px;border-right:2px solid #7fd7ff}
  .bar{position:absolute;left:0;right:0;height:0;background:#000;transition:height .08s}
  #barTop{top:0} #barBot{bottom:0}
  body.cut .bar{height:11vh}
  body.cut #info, body.cut #queue, body.cut #target{opacity:0}
  html[data-hints="0"] #info{display:none}
  #target .tfl{font:italic 11px Georgia,'Times New Roman',serif;color:#e8d8b0;opacity:.7;margin-top:3px;text-align:center;letter-spacing:.02em}
  #hud-root .slot.cond{border-color:#9be37f;box-shadow:0 0 10px #9be37f88,0 0 0 1px #9be37f inset}
</style>
  <script type="module" crossorigin src="./assets/index-BdgnbFfX.js"></script>
</head>
<body>
<div id="preload"><b>STICKFALL</b><div class="bar"><i></i></div><div class="st">opening the book</div></div>
<div id="hud"><div class="bar" id="barTop"></div><div class="bar" id="barBot"></div><div id="mode"></div><div id="target"></div><div id="info"></div><div id="queue"></div></div>
</body>
</html>
